<div class="card" cdkDrag [ngClass]="{ 'cursor-pointer': !!card?.id}" (click)="openCard(card?.id)">
  @if (card?.id) {
    <div class="card-title">{{ card?.title }}</div>
    <p>{{ card?.description || 'No description' }}</p>
  } @else {
    <input pInputText [(ngModel)]="card.title" [pAutoFocus]="true" (focusout)="createCard()" (keyup)="onKeyUp($event)">
  }


</div>
