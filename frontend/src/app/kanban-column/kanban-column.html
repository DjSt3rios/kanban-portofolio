<div class="column">
  <h3>{{ column.title }}</h3>

  <div
    class="card-list"
    cdkDropList
    [cdkDropListData]="column.cards"
    (cdkDropListDropped)="onCardDrop($event, column.id)">

    @for (card of column.cards; track card.id) {
      <div class="card" cdkDrag>
        <h4>{{ card.title }}</h4>
        <p>{{ card.description }}</p>
      </div>
    }
  </div>
  

</div>
