<div class="flex flex-column gap-2">
  <div class="flex gap-2 column-header">
    <i class="pi pi-bars align-self-center" cdkDragHandle></i>
    <p-inplace (onDeactivate)="onClosed()">
      <ng-template #display>
        <div class="column-title">{{ column.title }}</div>
      </ng-template>
      <ng-template #content let-closeCallback="closeCallback">
        <input pInputText [(ngModel)]="title" placeholder="Enter name" class="flex-1 m-2"
               [fluid]="false"
               [pAutoFocus]="true"
               [invalid]="title?.length < 3"
               [style]="{ 'font-size': '1rem', width: '100%', margin: '0 !important' }"
               (focusout)="closeCallback($event)"
               (keyup)="onKeyUp($event, closeCallback)" />
      </ng-template>
    </p-inplace>
    <button class="ml-auto delete-button" pButton iconOnly variant="outlined" severity="danger" aria-label="Cancel" (click)="confirmColumnDeletion($event)"><i class="pi pi-trash"></i></button>
  </div>


  <div class="column">
    <div
      class="card-list"
      cdkDropList
      [id]="column.id.toString()"
      [cdkDropListConnectedTo]="connectedListIds"
      [cdkDropListEnterPredicate]="isCardDrag"
      [cdkDropListData]="column.cards"
      (cdkDropListDropped)="onCardDrop($event, column.id)">

      @for (card of column.cards; track card.id) {
        <app-kanban-card [card]="card" (destroyCard)="destroyCard($event)"></app-kanban-card>
      }

    </div>
    <button pButton class="new-card mb-3 mt-3 align-self-center" (click)="newCard()">Add a new card</button>
  </div>

</div>

<p-confirmpopup />
